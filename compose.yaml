services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hero
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: hero
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hero-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d hero"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  hero-postgres-data:
